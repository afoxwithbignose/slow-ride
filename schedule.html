<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>慢骑 · 日程表</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="app.css">
</head>
<body data-page="schedule">
<div class="app">

  <aside class="sidebar">
    <a class="brand" href="focus.html" aria-label="慢骑首页">
      <span class="brand-mark">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <path d="M4 27h24" stroke="#1E3B4A" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M12.6 9h6.8v14h-6.8z" fill="#FFF9EC" stroke="#1E3B4A" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="M13 13h6M13 17.2h6" stroke="#F26B4E" stroke-width="2.8"/>
          <path d="M12.6 9 16 4.6 19.4 9Z" fill="#F7C565" stroke="#1E3B4A" stroke-width="2" stroke-linejoin="round"/>
          <path d="M19.6 7.4 25 5.4M12.4 7.4 7 5.4" stroke="#F7C565" stroke-width="2" stroke-linecap="round"/>
          <path d="M18 25.8h-4l-.9-2.8h5.8z" fill="#FFF9EC" stroke="#1E3B4A" stroke-width="1.8" stroke-linejoin="round"/>
          <circle cx="16" cy="24.4" r="0.9" fill="#1E3B4A"/>
        </svg>
      </span>
      <span class="brand-text"><b>慢骑</b><i>SLOW RIDE</i></span>
    </a>

    <nav class="nav" aria-label="主导航">
      <a href="focus.html" data-nav="focus"><svg class="icon" aria-hidden="true"><use href="#i-coast"></use></svg><span>专注海岸</span><span class="nav-k">01</span></a>
      <a href="plan.html" data-nav="plan"><svg class="icon" aria-hidden="true"><use href="#i-flag"></use></svg><span>我的规划</span><span class="nav-k">02</span></a>
      <a href="schedule.html" data-nav="schedule"><svg class="icon" aria-hidden="true"><use href="#i-cal"></use></svg><span>日程表</span><span class="nav-k">03</span></a>
      <a href="character.html" data-nav="character"><svg class="icon" aria-hidden="true"><use href="#i-shirt"></use></svg><span>角色衣柜</span><span class="nav-k">04</span></a>
    </nav>

    <div class="side-note">
      <div class="micro">今日航程 · TODAY</div>
      <div class="amount"><b data-today-min>50</b><span>分钟</span></div>
      <div class="seg-bar mini" data-today-seg aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    </div>

    <div class="side-foot">
      <button class="sound-btn" type="button" data-sound aria-pressed="false">
        <svg class="icon" aria-hidden="true"><use href="#i-sound"></use></svg>
        <span>海岸环境声</span>
        <span class="eq" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="state">开启</span>
      </button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-title">
        <span class="eyebrow">WEEK VIEW · <span data-today>11月19日 周四</span></span>
        <h1>日程表</h1>
      </div>
      <div class="topbar-actions">
        <a class="session-chip" id="sessionChip" href="focus.html" hidden><span class="pulse"></span><span data-session-time>25:00</span></a>
        <span class="badge sun" data-streak>连续 7 天</span>
        <button class="icon-btn" type="button" data-sound aria-pressed="false" aria-label="海岸环境声">
          <svg class="icon" aria-hidden="true"><use href="#i-sound"></use></svg>
        </button>
        <a class="avatar" href="character.html" aria-label="阿满的角色衣柜">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <rect width="64" height="64" fill="#BFE6F6"></rect>
            <circle cx="50" cy="13" r="6.5" fill="#F7C565"></circle>
            <path d="M0 47c10-5 21-6 32-3s21 4 32 1v19H0z" fill="#8FD8CB"></path>
            <path d="M0 54c9-3 19-3 32-1s23 2 32 0v11H0z" fill="#19A99A" opacity=".5"></path>
            <g stroke="#1E3B4A" stroke-width="2.4" stroke-linejoin="round">
              <rect x="25" y="29" width="16" height="26" rx="8" fill="#FFFDF6"></rect>
              <circle cx="33" cy="26" r="12.5" fill="#FFFDF6"></circle>
              <path d="M44 21.5h8.6a3.4 3.4 0 0 1 0 6.8H44z" fill="#F7A23B"></path>
              <rect x="21" y="35" width="22" height="6.5" rx="3.2" fill="#F26B4E"></rect>
            </g>
            <circle cx="37.6" cy="23.4" r="2.1" fill="#1E3B4A"></circle>
          </svg>
        </a>
      </div>
    </header>

    <main class="content">
      <p class="lead" style="margin:0 0 16px">先安顿好想做的事，剩下的时间，留给海风和发呆。</p>

      <div class="toolbar week-toolbar">
        <div class="week-nav">
          <button class="btn icon" type="button" data-week-prev aria-label="上一周">
            <svg class="icon" aria-hidden="true"><use href="#i-left"></use></svg>
          </button>
          <span class="week-range" data-week-label>11/16 – 11/22</span>
          <button class="btn icon" type="button" data-week-next aria-label="下一周">
            <svg class="icon" aria-hidden="true"><use href="#i-right"></use></svg>
          </button>
          <button class="btn sm" type="button" data-week-today>回到本周</button>
        </div>
        <div class="legend" aria-label="日程类型图例">
          <span><i style="background:var(--tint-focus)"></i>专注</span>
          <span><i style="background:var(--tint-class)"></i>课程</span>
          <span><i style="background:var(--tint-move)"></i>运动</span>
          <span><i style="background:var(--tint-rest)"></i>休息</span>
        </div>
        <button class="btn primary" type="button" data-add-event>
          <svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg>加一个安排
        </button>
      </div>

      <div class="week-wrap">
        <div class="week" id="weekGrid"></div>
      </div>
      <div class="schedule-hint desk-only">
        <svg class="icon" aria-hidden="true"><use href="#i-info"></use></svg>
        点一下安排可以标记完成，悬停右上角的 × 可以删掉。
      </div>

      <div class="mobile-days">
        <div class="toolbar" style="margin-bottom:8px">
          <div class="week-nav">
            <button class="btn icon" type="button" data-week-prev aria-label="上一周"><svg class="icon" aria-hidden="true"><use href="#i-left"></use></svg></button>
            <span class="week-range" data-week-label>11/16 – 11/22</span>
            <button class="btn icon" type="button" data-week-next aria-label="下一周"><svg class="icon" aria-hidden="true"><use href="#i-right"></use></svg></button>
          </div>
          <button class="btn primary" type="button" data-add-event><svg class="icon" aria-hidden="true"><use href="#i-plus"></use></svg>加安排</button>
        </div>
        <div class="mobile-day-tabs" id="mobileDayTabs"></div>
        <div class="mobile-day-list" id="mobileDayList"></div>
      </div>
    </main>
  </div>
</div>

<div class="modal" id="eventModal" hidden role="dialog" aria-modal="true" aria-labelledby="eventModalTitle">
  <div class="modal-back" data-close></div>
  <div class="modal-panel">
    <button class="modal-close" type="button" data-close aria-label="关闭">
      <svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg>
    </button>
    <div class="micro" style="justify-content:center">NEW PLAN</div>
    <h2 id="eventModalTitle">加一个安排</h2>
    <p class="h-sub">不用排得太满，给海风留一小时。</p>
    <form id="eventForm" autocomplete="off">
      <label class="field-label" for="evTitle">做什么</label>
      <input class="field" id="evTitle" type="text" maxlength="20" placeholder="例如：专注：作品集首页" required style="margin-bottom:14px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div>
          <label class="field-label" for="evDate">哪一天</label>
          <select class="field" id="evDate"></select>
        </div>
        <div>
          <label class="field-label" for="evType">类型</label>
          <select class="field" id="evType">
            <option value="focus">专注</option>
            <option value="class">课程</option>
            <option value="move">运动</option>
            <option value="rest">休息</option>
          </select>
        </div>
        <div>
          <label class="field-label" for="evStart">开始时间</label>
          <input class="field" id="evStart" type="time" value="09:30">
        </div>
        <div>
          <label class="field-label" for="evDur">多长时间</label>
          <select class="field" id="evDur">
            <option value="30">30 分钟</option>
            <option value="45">45 分钟</option>
            <option value="60" selected>1 小时</option>
            <option value="90">1.5 小时</option>
            <option value="120">2 小时</option>
          </select>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn" type="button" data-close>先不排</button>
        <button class="btn primary" type="submit">写进日程</button>
      </div>
    </form>
  </div>
</div>

<script src="audio.js" defer></script>
<script src="vendor/three.min.js" defer></script>
<script src="scene.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
